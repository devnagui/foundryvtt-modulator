name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  tests:
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration tests (mocked)
        run: python -m unittest discover -s tests -v

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Linux .deb
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          chmod +x packaging/deb/build_deb.sh
          ./packaging/deb/build_deb.sh "${GITHUB_REF_NAME#v}"

      - name: Build Windows exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./packaging/windows/build_windows.ps1 -Version $version

      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x packaging/macos/build_macos_app.sh
          ./packaging/macos/build_macos_app.sh "${GITHUB_REF_NAME#v}"

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaging-${{ matrix.os }}-${{ github.ref_name }}
          path: dist/**
