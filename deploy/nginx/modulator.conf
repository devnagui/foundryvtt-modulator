server {
  listen 80;
  server_name _;

  # UI root
  location = /modulator {
    return 302 /modulator/;
  }

  # API is restricted by default (LAN + localhost).
  # If you need public API, add auth/allowlist explicitly.
  location ^~ /api/v1/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://modulator:8787/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /modulator/assets/ {
    rewrite ^/modulator/assets/(.*)$ /assets/$1 break;
    proxy_pass http://modulator:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /modulator/ {
    rewrite ^/modulator/?(.*)$ /$1 break;
    proxy_pass http://modulator:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Keep legacy route disabled by default
  location ^~ /module-resolver {
    return 404;
  }
}
