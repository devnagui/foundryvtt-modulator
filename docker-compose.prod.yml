services:
  foundryvtt-modulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foundryvtt-modulator
    restart: unless-stopped
    ports:
      - "${RESOLVER_HOST_BIND:-127.0.0.1}:${RESOLVER_PORT:-8787}:8787"
    environment:
      RESOLVER_BIND_HOST: 0.0.0.0
      RESOLVER_BIND_PORT: 8787
      RESOLVER_DATA_ROOT: /foundry-data
      RESOLVER_CACHE_DIR: /app/.cache
      RESOLVER_STATE_DIR: /app/state
      RESOLVER_REPORTS_DIR: /app/reports
      RESOLVER_REQUIRE_FOUNDRY_OFFLINE: "${RESOLVER_REQUIRE_FOUNDRY_OFFLINE:-true}"
      RESOLVER_FOUNDRY_HOST: "${RESOLVER_FOUNDRY_HOST:-host.docker.internal}"
      RESOLVER_FOUNDRY_PORT: "${RESOLVER_FOUNDRY_PORT:-30000}"
      RESOLVER_COOKIE_SECURE: "${RESOLVER_COOKIE_SECURE:-true}"
      RESOLVER_SESSION_TTL_HOURS: "${RESOLVER_SESSION_TTL_HOURS:-12}"
      RESOLVER_PBKDF2_ITERATIONS: "${RESOLVER_PBKDF2_ITERATIONS:-390000}"
      RESOLVER_AUTH_MAX_FAILED_ATTEMPTS: "${RESOLVER_AUTH_MAX_FAILED_ATTEMPTS:-5}"
      RESOLVER_AUTH_LOCKOUT_MINUTES: "${RESOLVER_AUTH_LOCKOUT_MINUTES:-15}"
      RESOLVER_MAX_SESSIONS: "${RESOLVER_MAX_SESSIONS:-200}"
    volumes:
      - "${FOUNDRY_DATA_ROOT:?set FOUNDRY_DATA_ROOT env}:/foundry-data:ro"
      - "./reports:/app/reports"
      - "./state:/app/state"
      - "./.cache:/app/.cache"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
